name: CI

on:
  push:
  pull_request:

jobs:
  domain-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Domain rules unit tests (xUnit, C# 9 like Unity)
        run: dotnet test Tests/HoloTable.Domain.Tests --nologo

      - name: Compile all Unity scripts against UnityEngine reference assemblies
        run: dotnet build Tools/UnityCompileCheck --nologo
